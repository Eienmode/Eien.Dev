<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — eien.dev</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0c0d">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c0c0d;--bone:#ece9e2;--mute:#8f8b84;--line:rgba(236,233,226,.22);--ember:#d946ef}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:1.5rem;background:var(--ink);color:var(--bone);font:400 1.0625rem/1.6 "Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:34rem;width:100%}
.mono{font-family:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
h1{font-size:clamp(4rem,18vw,9rem);line-height:.9;letter-spacing:-.05em;font-weight:600;margin:.75rem 0 1rem}
h1 span{color:var(--ember)}
p{color:var(--mute);margin:0 0 2rem}
a{display:inline-flex;gap:.5rem;align-items:center;color:var(--bone);text-decoration:none;border:1px solid var(--line);padding:.8rem 1.2rem;border-radius:999px;font:500 .8rem "Geist Mono",ui-monospace,monospace;text-transform:uppercase;letter-spacing:.04em;transition:border-color .2s,color .2s}
a:hover,a:focus-visible{border-color:var(--ember);color:var(--ember)}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="mono">eien.dev / error</div>
  <h1>404<span>.</span></h1>
  <p>This page doesn't exist, or it moved.</p>
  <a href="/">← Back to the portfolio</a>
</main>
</body>
</html>
